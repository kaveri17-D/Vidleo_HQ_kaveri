services:
  po-token-sidecar:
    build: ../po-token-sidecar
    restart: unless-stopped
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/health > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    networks:
      - nexus_internal

  backend:
    build: .
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - NEXUS_USE_CELERY=1
      - NEXUS_USE_CELERY_BEAT=1
      - YOUTUBE_PO_TOKEN_SIDECAR_URL=http://po-token-sidecar:3000/generate
    volumes:
      - .:/app/backend
      - ./cookies.txt:/app/backend/cookies.txt:ro
    deploy:
      update_config:
        order: start-first
        failure_action: rollback
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      redis:
        condition: service_started
      po-token-sidecar:
        condition: service_healthy
    networks:
      - nexus_internal

  redis:
    image: redis:alpine
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --auto-aof-rewrite-percentage 100
      --auto-aof-rewrite-min-size 64mb
      --save 900 1
      --save 300 10
      --save 60 10000
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - nexus_internal

  metadata_worker:
    build: .
    command: celery -A backend.celery_app worker --loglevel=info --hostname=metadata@%h -Q meta
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - YOUTUBE_PO_TOKEN_SIDECAR_URL=http://po-token-sidecar:3000/generate
    volumes:
      - .:/app/backend
      - ./cookies.txt:/app/backend/cookies.txt:ro
    depends_on:
      redis:
        condition: service_started
      po-token-sidecar:
        condition: service_healthy
    networks:
      - nexus_internal

  download_worker:
    build: .
    command: celery -A backend.celery_app worker --loglevel=info --hostname=download@%h -Q render
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - YOUTUBE_PO_TOKEN_SIDECAR_URL=http://po-token-sidecar:3000/generate
    volumes:
      - .:/app/backend
      - ./cookies.txt:/app/backend/cookies.txt:ro
    depends_on:
      redis:
        condition: service_started
      po-token-sidecar:
        condition: service_healthy
    networks:
      - nexus_internal

  syndication_worker:
    build: .
    command: celery -A backend.celery_app worker --loglevel=info --hostname=syndicate@%h -Q syndicate
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - YOUTUBE_PO_TOKEN_SIDECAR_URL=http://po-token-sidecar:3000/generate
    volumes:
      - .:/app/backend
      - ./cookies.txt:/app/backend/cookies.txt:ro
    depends_on:
      redis:
        condition: service_started
      po-token-sidecar:
        condition: service_healthy
    networks:
      - nexus_internal

  maintenance_worker:
    build: .
    command: celery -A backend.celery_app worker --loglevel=info --hostname=maintenance@%h -Q maintenance_worker
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - NEXUS_USE_CELERY_BEAT=1
      - YOUTUBE_PO_TOKEN_SIDECAR_URL=http://po-token-sidecar:3000/generate
    volumes:
      - .:/app/backend
      - ./cookies.txt:/app/backend/cookies.txt:ro
    depends_on:
      redis:
        condition: service_started
    networks:
      - nexus_internal

  celery_beat:
    build: .
    command: celery -A backend.celery_app beat --loglevel=info
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - NEXUS_USE_CELERY_BEAT=1
      - YOUTUBE_PO_TOKEN_SIDECAR_URL=http://po-token-sidecar:3000/generate
    volumes:
      - .:/app/backend
      - ./cookies.txt:/app/backend/cookies.txt:ro
    depends_on:
      redis:
        condition: service_started
    networks:
      - nexus_internal

  telegram_bot:
    build: .
    command: python -m backend.bots.telegram_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - YOUTUBE_PO_TOKEN_SIDECAR_URL=http://po-token-sidecar:3000/generate
    volumes:
      - .:/app/backend
      - ./cookies.txt:/app/backend/cookies.txt:ro
    depends_on:
      redis:
        condition: service_started
    networks:
      - nexus_internal

  discord_bot:
    build: .
    command: python -m backend.bots.discord_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - YOUTUBE_PO_TOKEN_SIDECAR_URL=http://po-token-sidecar:3000/generate
    volumes:
      - .:/app/backend
      - ./cookies.txt:/app/backend/cookies.txt:ro
    depends_on:
      redis:
        condition: service_started
    networks:
      - nexus_internal

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - backend
    networks:
      - nexus_internal

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3010:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - nexus_internal

networks:
  nexus_internal:
    driver: bridge

volumes:
  redis_data:
    driver: local
